name: Desplegar iam en local (directo, sin validaciones)

on:
  push:
    branches:
      - local

concurrency:
  group: release-iam-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Compilar y publicar la imagen iam con el tag local.
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio para acceder al código.
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compilar y publicar la imagen iam en Docker Hub.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iam:local

  deploy:
    name: Disparar el deploy de iam en deploy-hub-api.
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Clonar la rama local de deploy-hub-api.
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deploy-hub-api
          ref: local
          token: ${{ secrets.IAM_DISPATCH_TOKEN }}
          path: deploy-hub-api

      - name: Registrar el deploy de iam en deploy-hub-api para disparar su workflow local.
        env:
          SOURCE_SHA: ${{ github.sha }}
        working-directory: deploy-hub-api
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/local-triggers
          echo "$SOURCE_SHA $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/local-triggers/iam
          git add .github/local-triggers/iam
          git commit -m "chore: trigger local deploy of iam"
          for attempt in 1 2 3 4 5; do
            git push origin local && exit 0
            git pull --rebase origin local
          done
          exit 1
